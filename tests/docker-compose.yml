# Uso con podman (prioritario). Sin --build, hace PULL de la imagen publicada
# en ghcr.io; con --build, la compila localmente desde el Dockerfile:
#   podman compose -f tests/docker-compose.yml run test ./runtests.sh -v          # descarga
#   podman compose -f tests/docker-compose.yml run --build test ./runtests.sh -v  # compila
# Uso con docker: mismo par de comandos con `docker compose`.
services:
  test:
    image: ghcr.io/marcodesparza/oca-ci-arm:py3.11-odoo19.0
    build:
      context: ..
      args:
        python_version: "3.11"
        odoo_version: "19.0"
        odoo_org_repo: "odoo/odoo"
    volumes:
      - ..:/mnt/oca-ci-arm
    working_dir: /mnt/oca-ci-arm/tests
    depends_on:
      - postgres
  postgres:
    image: docker.io/library/postgres
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
