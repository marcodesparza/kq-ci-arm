name: ci

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  main:
    # Repo público: usamos el runner arm64 nativo de GitHub (gratis en repos
    # públicos), así la build y los tests corren sin emulación. Si el repo se
    # vuelve privado, cambiar a ubuntu-latest + docker/setup-qemu-action@v3.
    runs-on: ubuntu-24.04-arm
    env:
      python_version: "3.11"
      odoo_version: "19.0"
      odoo_org_repo: "odoo/odoo"
      image_name: ghcr.io/${{ github.repository_owner }}/oca-ci-arm
      image_tag: py3.11-odoo19.0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            python_version=${{ env.python_version }}
            odoo_version=${{ env.odoo_version }}
            odoo_org_repo=${{ env.odoo_org_repo }}
          tags: |
            ${{ env.image_name }}:${{ env.image_tag }}
            ${{ env.image_name }}:latest
          load: true
          cache-from: type=gha,scope=odoo${{ env.odoo_version }}
          cache-to: type=gha,mode=max,scope=odoo${{ env.odoo_version }}
      - name: Tests
        run: >-
          docker run -v ${PWD}/tests:/mnt/tests
          --network=host -e PGHOST=localhost
          ${{ env.image_name }}:${{ env.image_tag }} /mnt/tests/runtests.sh -v
      - name: Smoke checks
        run: >-
          docker run ${{ env.image_name }}:${{ env.image_tag }}
          bash -c "odoo --version && chromium --version && wkhtmltopdf --version"
      # Solo se publica si los tests pasaron y estamos en master.
      # buildx no permite --load y --push en la misma build, así que este paso
      # reconstruye usando el caché (rápido) y empuja a ghcr.io.
      - name: Push image to ghcr.io
        if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            python_version=${{ env.python_version }}
            odoo_version=${{ env.odoo_version }}
            odoo_org_repo=${{ env.odoo_org_repo }}
          tags: |
            ${{ env.image_name }}:${{ env.image_tag }}
            ${{ env.image_name }}:latest
          push: true
          cache-from: type=gha,scope=odoo${{ env.odoo_version }}
